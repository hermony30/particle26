<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Magical Mickey Shape Aura - Slow</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000 !important;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="mc"></canvas>

<script>
    const canvas = document.getElementById('mc');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let particles = [];
    const colors = [
        'rgba(255, 183, 213, 0.45)', // パステルピンク
        'rgba(194, 224, 255, 0.45)', // ベビーブルー
        'rgba(224, 187, 228, 0.45)', // ラベンダー
        'rgba(255, 245, 186, 0.45)', // パステルイエロー
        'rgba(191, 252, 198, 0.45)', // ミントグリーン
        'rgba(255, 255, 255, 0.45)'  // ホワイト
    ];

    let mouse = { x: canvas.width / 2, y: canvas.height / 2 };

    window.addEventListener('mousemove', (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
    });

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            
            // ★ミッキーの顔のサイズ（以前の玉のサイズ基準）
            this.size = Math.random() * 20 + 10; 
            this.color = colors[Math.floor(Math.random() * colors.length)];
            
            this.vx = (Math.random() - 0.5) * 0.5;
            this.vy = (Math.random() - 0.5) * 0.5;
            
            this.friction = 0.985;
            this.ease = Math.random() * 0.03 + 0.01;
        }

        update() {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            
            if (dist < 500) {
                let angle = Math.atan2(dy, dx);
                let targetX = mouse.x - Math.cos(angle) * (Math.random() * 120 + 20);
                let targetY = mouse.y - Math.sin(angle) * (Math.random() * 120 + 20);
                this.vx += (targetX - this.x) * this.ease * 0.05;
                this.vy += (targetY - this.y) * this.ease * 0.05;
            } else {
                this.vx += (Math.random() - 0.5) * 0.02;
                this.vy += (Math.random() - 0.5) * 0.02;
            }

            this.vx *= this.friction;
            this.vy *= this.friction;
            this.x += this.vx;
            this.y += this.vy;

            // バウンド処理
            if (this.x < 0) { this.x = 0; this.vx *= -0.5; }
            if (this.x > canvas.width) { this.x = canvas.width; this.vx *= -0.5; }
            if (this.y < 0) { this.y = 0; this.vy *= -0.5; }
            if (this.y > canvas.height) { this.y = canvas.height; this.vy *= -0.5; }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = 1;
            
            // ミッキーの顔を描画（本体）
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();

            // ★ミッキーの耳を描画
            // 耳のサイズは顔の約0.6倍
            const earSize = this.size * 0.6;
            // 耳の位置を計算（顔の中心から45度の方向に配置）
            const earOffsetX = this.size * 0.85;
            const earOffsetY = this.size * 0.85;

            // 左耳
            ctx.beginPath();
            ctx.arc(this.x - earOffsetX, this.y - earOffsetY, earSize, 0, Math.PI * 2);
            ctx.fill();

            // 右耳
            ctx.beginPath();
            ctx.arc(this.x + earOffsetX, this.y - earOffsetY, earSize, 0, Math.PI * 2);
            ctx.fill();

            // --- 透明感を出すハイライト（少し薄く） ---
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            
            // 顔のハイライト
            ctx.beginPath();
            ctx.arc(this.x - this.size * 0.25, this.y - this.size * 0.25, this.size * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // 左耳のハイライト
            ctx.beginPath();
            ctx.arc(this.x - earOffsetX - earSize * 0.25, this.y - earOffsetY - earSize * 0.25, earSize * 0.3, 0, Math.PI * 2);
            ctx.fill();

            // 右耳のハイライト
            ctx.beginPath();
            ctx.arc(this.x + earOffsetX - earSize * 0.25, this.y - earOffsetY - earSize * 0.25, earSize * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // 粒子数を少し減らして（300個）、重なり具合を調整
    for (let i = 0; i < 300; i++) {
        particles.push(new Particle());
    }

    function animate() {
        ctx.fillStyle = "#000000"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < particles.length; i++) {
            particles[i].update();
            particles[i].draw();
        }

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
